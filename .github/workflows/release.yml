name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Build Release Binaries
        run: cargo build --release -p chirper-cli -p chirper-daemon

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          package="chirper-${version}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${package}/bin"
          cp target/release/chirper "dist/${package}/bin/"
          cp target/release/chirper-daemon "dist/${package}/bin/"
          cp -R apps crates docs extensions scripts "dist/${package}/"
          cp README.md CONTRIBUTING.md Cargo.lock Cargo.toml LICENSE "dist/${package}/"
          tar -C dist -czf "${package}.tar.gz" "${package}"
          sha256sum "${package}.tar.gz" > "${package}.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          package="chirper-${version}-x86_64-unknown-linux-gnu"
          gh release create "${version}" \
            "${package}.tar.gz" \
            "${package}.sha256" \
            --title "Chirper ${version}" \
            --generate-notes \
            --verify-tag
