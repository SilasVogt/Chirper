name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: clippy,rustfmt

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Check Workspace
        run: cargo check --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Workspace
        run: cargo test --workspace

      - name: Install Smoke Test
        run: |
          sudo apt-get update
          sudo apt-get install -y pipewire-bin wl-clipboard
          scripts/install.sh --source-dir "$PWD" --bin-dir "$RUNNER_TEMP/chirper-bin" --profile debug --gui none --no-whispercpp --no-service
          "$RUNNER_TEMP/chirper-bin/chirper" --version

  scripts-and-gjs:
    name: Scripts and GJS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Check Shell Scripts
        run: bash -n scripts/*.sh

      - name: Check GJS Syntax
        run: find extensions apps -name '*.js' -exec node --check {} \;
