# Chirper config example.
# Default path: ~/.config/chirper/config.toml

audio_backend = "pipewire"

# Empty or "auto" lets WirePlumber choose the default source. If Chirper records
# desktop playback or the wrong input, run `wpctl status` and set this to a
# source id or node name, for example:
# pipewire_target = "65"
# pipewire_target = "alsa_input.usb-example.mic"
pipewire_target = "auto"

asr_backend = "whisper-cpp"

# "balanced" keeps whisper.cpp's normal decoding behavior. "fast" uses fewer
# decoder candidates, disables fallback retries, and drops text context for
# lower stop-to-text latency.
transcription_profile = "balanced"

# Start with "auto". On AMD, useful explicit values are "rocm" and "vulkan".
gpu_backend = "auto"

# "rules" is fast local punctuation/symbol replacement plus vocabulary,
# edit commands, and conservative domain/email cleanup. "ollama" enables AI
# formatting; the daemon sends the raw transcript to the selected Ollama model
# and copies/pastes the model output.
formatter_backend = "rules"

# Initial insertion backends will be "clipboard" and "uinput".
insertion_backend = "clipboard"

# Modes change how aggressive local symbol rules are. Auto is conservative;
# code/command convert ambiguous words like "dot", "at", "space", and "pipe".
dictation_mode = "auto"

# Installer-selected GUI profile. "gnome" launches the GNOME settings app from
# `chirper settings`; "none" disables GUI launchers for CLI/daemon-only installs.
gui_profile = "gnome"

whisper_model = "base"

# The wrapper expects whisper.cpp's CLI. The current upstream binary is usually
# named "whisper-cli" after building whisper.cpp.
whispercpp_command = "whisper-cli"

# Configure this before using `chirper transcribe-file` or the full dictation
# loop. Example:
# whispercpp_model_path = "/home/silas/.local/share/chirper/models/ggml-base.bin"
whispercpp_model_path = ""

# Empty or "auto" lets whisper.cpp choose. Use "en", "id", "de", etc. to force one.
whisper_language = "auto"

# Ollama is optional. Use `chirper ollama-list`, `chirper ollama-use <model>`,
# and `chirper formatter-use ollama <model>` to select a local model.
ollama_command = "ollama"
ollama_model = "granite4.1:8b"

# If true, the daemon starts loading the selected Ollama model when recording
# starts. The formatting call asks Ollama to unload after generation.
ollama_preload_on_recording = true

# Prompt logs are written under ~/.config/chirper/prompt-logs. Use 0 to disable.
format_log_retention_days = 7

# Codex CLI is optional. It uses your installed `codex` auth/config and runs
# `codex exec` in read-only, no-approval, ephemeral mode.
codex_command = "codex"
codex_model = ""
codex_profile = ""
codex_reasoning_effort = ""
codex_service_tier = ""
codex_config_overrides = []

# Named Codex comparison profiles for `chirper format-compare --codex-profile fast`.
[codex_profiles.fast]
model = "gpt-5.5"
reasoning_effort = "low"
service_tier = "priority"

[codex_profiles.extra_high]
model = "gpt-5.5"
reasoning_effort = "xhigh"
service_tier = "priority"
config_overrides = ["model_verbosity=\"low\""]

# Learned and manually configured preferred spellings. The rules preprocessor
# applies these before the optional LLM proofreader sees the text.
[vocabulary]
"silas on linux" = "SilasOnLinux"
"prepped" = "Prepd"
